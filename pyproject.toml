[project]
name = "rag-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "omarior", email = "aviloff@yandex.ru" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.0",
]

[project.scripts]
rag-lab = "rag_lab:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
