# Золотой набор вопросов для оценки поиска
#
# Собран одновременно с генерацией договоров: мы знаем, что куда заложено,
# поэтому разметка почти бесплатна. Методика — RAG/research/reference/retrieval-rerank.md.
#
# ПРАВИЛО, без которого набор бесполезен: вопросы сформулированы НЕ словами
# договора. Если в вопросе те же слова, что в пункте, задача вырождается
# в поиск по подстроке и любой метод покажет отличный результат.
# Пример: в договоре «простой транспортного средства сверх нормативного
# времени», в вопросе — «машина ждёт под загрузкой дольше положенного».
#
# Ссылки: <doc_id>#<номер пункта>.
# У SH-45 нумерация автоматическая (Word), в тексте номеров нет —
# ссылки позиционные: <раздел>.<порядковый номер пункта в разделе>.
#
# Поле superseded: пункт действует, но изменён допсоглашением. Верный ответ
# должен содержать актуальную редакцию; старая — повод для проверки логики
# «истории значений» из RAG/research/reference/extraction.md.

meta:
  created: 2026-08-06
  corpus: 5 документов, 4 договора + 1 допсоглашение
  note: >
    Договоры сгенерированы нами. Формулировки однообразнее реальных,
    поэтому абсолютные значения метрик будут завышены. Набор годится
    для сравнения версий пайплайна между собой, не для оценки продукта.

questions:

  # --- Простой транспорта: одно понятие, три разных термина в корпусе ---
  - q: "во сколько обойдётся, если машина ждёт под загрузкой дольше положенного"
    relevant: ["TR-114#5.2", "EKS-77#13", "TR-114-DS1#1.3"]
    tests: "синонимия: простой / сверхнормативное ожидание / демередж"

  - q: "сколько времени грузовик может стоять на погрузке бесплатно"
    relevant: ["TR-114#5.1", "EKS-77#11"]

  - q: "с какого момента отсчитывают задержку машины"
    relevant: ["TR-114#5.3", "EKS-77#14"]

  - q: "когда за ожидание транспорта платить не нужно"
    relevant: ["TR-114#5.4", "EKS-77#15"]

  # --- Опоздание с доставкой ---
  - q: "что грозит перевозчику за опоздание с грузом"
    relevant: ["TR-114#6.2", "EKS-77#25"]

  - q: "есть ли потолок у санкций за нарушение сроков доставки"
    relevant: ["TR-114#6.2", "EKS-77#25"]

  # --- Утрата и повреждение груза ---
  - q: "кто отвечает, если товар пропал в дороге"
    relevant: ["TR-114#6.4", "EKS-77#22"]

  - q: "какую максимальную сумму можно взыскать за пропавший товар"
    relevant: ["EKS-77#23", "SH-45#4.2"]
    tests: "предел ответственности при неуказанной ценности"

  - q: "возмещают ли недополученную прибыль"
    relevant: ["EKS-77#24", "SH-45#4.3"]

  - q: "что если груз доехал повреждённым"
    relevant: ["TR-114#6.5"]

  # --- Расчёты ---
  - q: "как быстро нужно расплатиться по выставленному счёту"
    relevant: ["TR-114#4.3", "EKS-77#19", "SH-45#3.5", "TR-114-DS1#1.2"]
    superseded: ["TR-114#4.3"]

  - q: "что будет за задержку платежа"
    relevant: ["TR-114#6.6", "EKS-77#21", "AR-203#5.1", "SH-45#4.4"]

  - q: "могут ли не отдать товар из-за долга"
    relevant: ["EKS-77#20", "SH-45#3.6"]
    tests: "право удержания, слово «удержание» в вопросе отсутствует"

  # --- Срок действия ---
  - q: "продлевается ли соглашение само собой, если о нём забыть"
    relevant: ["TR-114#8.2", "AR-203#6.2", "SH-45#6.2"]

  - q: "до какого числа действует перевозка с Ромашкой"
    relevant: ["TR-114#8.1", "TR-114-DS1#1.4"]
    superseded: ["TR-114#8.1"]

  - q: "за сколько предупреждать, если хочешь прекратить сотрудничество"
    relevant: ["TR-114#8.3", "EKS-77#29", "SH-45#6.4"]

  # --- Суд и право ---
  - q: "где будут разбираться при конфликте"
    relevant: ["TR-114#9.2", "EKS-77#32", "AR-203#7.1", "SH-45#7.2"]

  - q: "обязательно ли сначала писать претензию"
    relevant: ["TR-114#9.1", "SH-45#7.1"]

  # --- Страхование ---
  - q: "кто оформляет страховку на товар"
    relevant: ["EKS-77#10", "TR-114-DS1#1.6"]

  - q: "на какую сумму застрахована ответственность склада"
    relevant: ["SH-45#5.1"]

  # --- Аренда транспорта ---
  - q: "сколько километров в месяц можно проехать без доплаты"
    relevant: ["AR-203#3.5"]

  - q: "во что встанет лишний пробег"
    relevant: ["AR-203#3.6"]

  - q: "на кого вешают штрафы за нарушения на дороге"
    relevant: ["AR-203#3.4.3", "AR-203#3.4.3.1", "AR-203#3.4.3.2"]
    tests: "вложенность четвёртого уровня"

  - q: "можно ли отдать арендованную машину другой компании"
    relevant: ["AR-203#4.2.2", "AR-203#5.4"]

  - q: "что входит в ежемесячный платёж за машину, а что нет"
    relevant: ["AR-203#3.3", "AR-203#3.4"]

  # --- Складское хранение ---
  - q: "при какой температуре держат товар на складе"
    relevant: ["SH-45#2.1"]

  - q: "сколько стоит держать паллету на складе сутки"
    relevant: ["SH-45#3.1"]

  - q: "платить придётся даже если склад почти пустой?"
    relevant: ["SH-45#3.2"]
    tests: "минимальный оплачиваемый объём"

  - q: "сколько дней даётся вывезти товар после окончания хранения"
    relevant: ["SH-45#6.3"]

  # --- Прочее ---
  - q: "что если отказаться от машины в последний момент"
    relevant: ["TR-114#2.4"]

  - q: "когда стороны не отвечают за срыв обязательств"
    relevant: ["TR-114#7.1", "EKS-77#27", "SH-45#4.6"]

  - q: "какая сейчас предельная сумма по перевозке для Ромашки"
    relevant: ["TR-114-DS1#1.1"]
    superseded: ["TR-114#4.2"]
    tests: "актуальное значение против отменённого допсоглашением"
